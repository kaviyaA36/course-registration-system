
<!DOCTYPE html>
<html lang="en">
<head>

    <title>Course Registration System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e0f2fe, #ede9fe);

    <div class="container">


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Courses</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            padding: 35px 15px;
            text-align: center;
        }

        h1 {
            color: #312e81;
        }

        .table-container {
            overflow-x: auto;
            max-width: 900px;
            margin: 25px auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 14px;
            border: 1px solid #cbd5e1;
        }

        th {
            background: #4f46e5;
            color: white;
        }

        tr:nth-child(even) {
            background: #e0e7ff;
        }

        a {
            color: #4338ca;
        }
    </style>
</head>

<body>
    <h1>Available Courses</h1>

    <p id="message" role="status">Loading courses...</p>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Course ID</th>
                    <th>Course Name</th>
                    <th>Trainer</th>
                    <th>Duration (Weeks)</th>
                </tr>
            </thead>

            <tbody id="coursetable"></tbody>
        </table>
    </div>

    <p><a href="index.html">Back to Home</a></p>

    <script src="myscript.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", showCourses);
    </script>
</body>
</html>
